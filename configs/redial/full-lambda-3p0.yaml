model:
  backbone_name_or_path: /data2/lhf/.MODEL/Qwen2.5-Omni-3B
  recommendation_head: item_table
  freeze_backbone: true
  num_prompt_tokens: 20
  hypergraph_hidden_dim: 1024
  hypergraph_output_dim: 256
  hypergraph_num_layers: 3
  grounding_checkpoint_path: outputs/redial/grounding-semantic/20261013T170344Z
  item_table_view: full
  recommendation_hidden_dim: 2048
  recommendation_attention_dim: 256
  recommendation_temperature: 0.07
  recommendation_view_loss_weight: 0.2
  conversation_loss_weight: 3.0
data:
  dataset_path: data/hyprorec-redial
  hyperedge_table_path: data/hyprorec-redial/feature_versions/clap-xclip-20261013T170344Z/hyperedge_table.json
  embeddings_dir_name: feature_versions/clap-xclip-20261013T170344Z/embeddings
  metric_tokenization: whitespace
  views: [txt, img, ado, vdo]
  topk: 3
  khop: 2
  hyperedge_sampling: strict
  sample_repeat: 1
  max_hypergraph_nodes: 64
  max_history_tokens: 256
  max_sequence_tokens: 1024
training:
  output_dir: outputs/redial/full-lambda-3p0
  do_train: true
  do_eval: true
  do_predict: true
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32
  num_train_epochs: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  bf16: true
  gradient_checkpointing: false
  ddp_find_unused_parameters: false
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  dataloader_persistent_workers: false
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 200
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  save_total_limit: 2
  logging_strategy: steps
  logging_steps: 20
  report_to: []
  run_name: full-lambda-3p0
  seed: 42
  data_seed: 42
