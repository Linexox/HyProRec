model:
  backbone_name_or_path: /data2/lhf/.MODEL/Qwen2.5-Omni-3B
  task: recommendation
  recommendation_head: mlp
  freeze_backbone: true
  num_prompt_tokens: 20
  hypergraph_hidden_dim: 1024
  hypergraph_output_dim: 256
  hypergraph_num_layers: 3
  grounding_checkpoint_path: outputs/redial/hocrs/grounding-eight-towers
  item_table_view: txt
  co_feature_view: txt
  recommendation_hidden_dim: 2048
  recommendation_temperature: 0.07
data:
  dataset_path: data/hocrs2_redial
  hyperedge_table_path: data/hocrs2_redial/hyperedge_table.json
  embeddings_dir_name: embeddings
  views: [ado]
  topk: 3
  khop: 2
  hyperedge_sampling: strict
  sample_repeat: 1
  max_history_tokens: 256
training:
  output_dir: outputs/redial/hocrs/rec-classifier-woco-h256-seed42-strict-ado
  do_train: true
  do_eval: true
  do_predict: true
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 2
  num_train_epochs: 5
  learning_rate: 0.0001
  weight_decay: 0.01
  lr_scheduler_type: constant
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs: {use_reentrant: false}
  ddp_find_unused_parameters: true
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 200
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  report_to: wandb
  run_name: ado
  seed: 42
  data_seed: 42
