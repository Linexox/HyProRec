model:
  grounding_tokenizer_name_or_path: /data2/lhf/.MODEL/all-mpnet-base-v2
  backbone_name_or_path: /data2/lhf/.MODEL/Qwen2.5-Omni-3B
  hypergraph_hidden_dim: 1024
  hypergraph_output_dim: 256
  hypergraph_num_layers: 3
  hypergraph_dropout: 0.0
  grounding_ga_sa_weight: 1.0
  grounding_ga_sn_weight: 3.0
  grounding_sa_sn_weight: 3.0
  grounding_temperature: 0.07

data:
  dataset_path: data/lhf-redial
  hyperedge_table_path: data/hocrs2_redial/hyperedge_table.json
  embeddings_dir_name: embeddings
  views: [txt, img, ado, vdo]
  topk: 5
  khop: 3

training:
  output_dir: outputs/redial/hocrs/grounding-wo-co-k5-h3
  do_train: true
  do_eval: true
  # Run with eight DDP ranks: 8 x 1 = the original global batch size of 8.
  # Batch one avoids Wav2Vec2 activation OOM for 160k-sample audio waveforms.
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  num_train_epochs: 5
  learning_rate: 0.0001
  weight_decay: 0.01
  lr_scheduler_type: constant
  max_grad_norm: 0.0
  label_names: []
  prediction_loss_only: true
  ddp_find_unused_parameters: true
  seed: 42
  data_seed: 42
  bf16: true
  eval_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  save_total_limit: 2
  remove_unused_columns: false
  report_to: wandb
  run_name: hocrs-grounding-wo-co-k5-h3
