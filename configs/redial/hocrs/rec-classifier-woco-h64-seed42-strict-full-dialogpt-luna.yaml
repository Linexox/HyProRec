model:
  backbone_name_or_path: microsoft/DialoGPT-small
  task: recommendation
  recommendation_head: mlp
  freeze_backbone: true
  num_prompt_tokens: 20
  hypergraph_hidden_dim: 1024
  hypergraph_output_dim: 256
  hypergraph_num_layers: 3
  grounding_checkpoint_path: /data2/lhf/HyProRec/core/outputs/redial/hocrs/grounding-eight-towers
  item_table_view: txt
  co_feature_view: txt
  recommendation_hidden_dim: 2048
  recommendation_temperature: 0.07
data:
  dataset_path: /data2/lhf/HyProRec/core/data/hocrs2_redial
  hyperedge_table_path: /data2/lhf/HyProRec/core/data/hocrs2_redial/hyperedge_table.json
  embeddings_dir_name: embeddings
  views: [txt, img, ado, vdo]
  topk: 3
  khop: 2
  hyperedge_sampling: strict
  sample_repeat: 1
  max_history_tokens: 64
training:
  output_dir: /data2/lhf/HyProRec/luna/outputs/redial/hocrs/rec-classifier-woco-h64-seed42-strict-full-dialogpt
  do_train: true
  do_eval: true
  do_predict: true
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 2
  num_train_epochs: 16
  learning_rate: 0.0001
  weight_decay: 0.01
  lr_scheduler_type: constant
  eval_strategy: steps
  eval_steps: 1343
  save_strategy: steps
  save_steps: 1343
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  report_to: wandb
  run_name: full-dialogpt
  seed: 42
  data_seed: 42
