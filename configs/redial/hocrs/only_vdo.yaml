model:
  backbone_name_or_path: /data2/lhf/.MODEL/Qwen2.5-Omni-3B
  freeze_backbone: true
  beta: 0.75
  num_soft_prompt_tokens: 10
  hypergraph_hidden_dim: 1024
  hypergraph_output_dim: 256
  hypergraph_num_layers: 3
  use_hypergraph_encoder: true
  grounding_checkpoint_path: outputs/redial/hocrs/grounding
  grounding_weight: 0.0
  item_table_init: random
  train_item_table: true

data:
  dataset_path: data/lhf-redial
  hyperedge_table_path: data/lhf-redial/hyperedge_table_v3.json
  embeddings_dir_name: embeddings_v3
  content_table_path: data/lhf-redial/content_tables_v3/full.pt
  views: [vdo]
  topk: 3
  khop: 2
  max_length: 1024
  max_history_tokens: 150
  max_response_tokens: 64

training:
  output_dir: outputs/redial/hocrs/only-vdo
  do_train: true
  do_eval: true
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  num_train_epochs: 8
  learning_rate: 0.00005
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs: {use_reentrant: false}
  eval_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  report_to: wandb
  run_name: hocrs-only-vdo
