model:
  backbone_name_or_path: /data2/lhf/.MODEL/Qwen2.5-Omni-3B
  freeze_backbone: true
  beta: 0.75
  num_soft_prompt_tokens: 10
  hypergraph_hidden_dim: 1024
  hypergraph_output_dim: 256
  hypergraph_num_layers: 3
  use_hypergraph_encoder: true
  grounding_checkpoint_path: outputs/redial/hocrs/grounding-wo-co-hyprorec
  item_table_mode: semantic_hybrid
  semantic_item_dim: 256
  recommendation_hidden_dim: 2048
  use_moe: true
  moe_num_experts: 4
  moe_hidden_dim: 512
  moe_router_temperature: 1.0
  moe_residual_scale_init: 1.0
  use_context_token: true
data:
  dataset_path: data/hocrs2_redial
  hyperedge_table_path: data/hocrs2_redial/hyperedge_table.json
  embeddings_dir_name: embeddings
  views: [txt, img, ado, vdo]
  topk: 3
  khop: 2
  max_length: 4096
  max_history_tokens: 1024
  max_response_tokens: 64
training:
  output_dir: outputs/redial/hocrs/full-moe-token-v4-h1024-ctx-semantic-hybrid
  do_train: true
  do_eval: true
  do_predict: true
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 2
  num_train_epochs: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  lr_scheduler_type: constant
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs: {use_reentrant: false}
  ddp_find_unused_parameters: true
  eval_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  report_to: wandb
  run_name: full-moe-token-v4-h1024-ctx-semantic-hybrid
  seed: 42
  data_seed: 42
