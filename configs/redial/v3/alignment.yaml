alignment:
  dataset_path: data/lhf-redial
  modalities: [txt, img, ado, vdo]
  txt_model_name_or_path: sentence-transformers/all-mpnet-base-v2
  img_model_name_or_path: google/vit-base-patch16-224-in21k
  ado_model_name_or_path: facebook/wav2vec2-base
  vdo_model_name_or_path: MCG-NJU/videomae-base
  alignment_dim: 256
  temperature: 0.07
  validation_ratio: 0.1
  max_text_length: 128

training:
  output_dir: outputs/redial/v3/alignment
  do_train: true
  do_eval: true
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  num_train_epochs: 10
  learning_rate: 0.00001
  weight_decay: 0.01
  warmup_steps: 0.1
  bf16: true
  eval_strategy: epoch
  save_strategy: epoch
  logging_strategy: steps
  logging_steps: 20
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  save_total_limit: 2
  report_to: wandb
  run_name: alignment
  seed: 42
  data_seed: 42
  dataloader_num_workers: 0
  remove_unused_columns: false
  label_names: [item_ids]
  dp_replicate_size: 1
  dp_shard_size: 1
