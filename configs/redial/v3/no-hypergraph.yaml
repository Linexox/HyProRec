model:
  backbone_name_or_path: /data2/lhf/.MODEL/Qwen2.5-Omni-3B
  freeze_backbone: true
  beta: 0.75
  num_soft_prompt_tokens: 10
  train_special_tokens: false
  use_hypergraph_encoder: true
  use_source_projector: false
  grounding_weight: 0.0
  item_table_init: aligned_content
  train_item_table: true
  recommendation_hidden_dim: 768
  recommendation_dropout: 0.0
  recommendation_temperature: 0.07

data:
  dataset_path: data/lhf-redial
  hyperedge_table_path: null
  embeddings_dir_name: embeddings_v3
  content_table_path: data/lhf-redial/content_tables_v3/full.pt
  views: []
  topk: 3
  khop: 2
  max_length: 1024

training:
  output_dir: outputs/redial/v3/no-hypergraph
  do_train: true
  do_eval: true
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  num_train_epochs: 8
  learning_rate: 0.00005
  warmup_steps: 0.1
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  eval_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  save_total_limit: 2
  report_to: wandb
  run_name: no-hypergraph
  seed: 42
  data_seed: 42
  dataloader_num_workers: 4
