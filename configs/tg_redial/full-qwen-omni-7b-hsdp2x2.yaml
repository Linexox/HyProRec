model:
  backbone_name_or_path: /data2/lhf/HyProRec/refactor/backbones/Qwen2.5-Omni-7B
  recommendation_head: item_table
  freeze_backbone: true
  num_prompt_tokens: 20
  hypergraph_hidden_dim: 1024
  hypergraph_output_dim: 256
  hypergraph_num_layers: 3
  grounding_checkpoint_path: outputs/tg_redial/grounding-semantic/20261013T170344Z
  item_table_view: full
  recommendation_hidden_dim: 2048
  recommendation_attention_dim: 256
  recommendation_temperature: 0.07
  recommendation_view_loss_weight: 0.5
  conversation_loss_weight: 1.0
  recommendation_router_hidden_dim: 512
data:
  dataset_path: data/hyprorec-tg-redial
  hyperedge_table_path: data/hyprorec-tg-redial/feature_versions/clap-xclip-20261013T170344Z/hyperedge_table.json
  embeddings_dir_name: feature_versions/clap-xclip-20261013T170344Z/embeddings
  metric_tokenization: jieba
  views: [txt, img, ado, vdo]
  topk: 3
  khop: 2
  hyperedge_sampling: strict
  sample_repeat: 1
  max_hypergraph_nodes: 64
  max_history_tokens: 256
  max_sequence_tokens: 1024
training:
  output_dir: outputs/tg_redial/full-qwen-omni-7b-hsdp2x2
  do_train: true
  do_eval: true
  do_predict: true
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 64
  num_train_epochs: 12
  learning_rate: 0.0005
  weight_decay: 0.01
  lr_scheduler_type: cosine_with_min_lr
  warmup_steps: 480
  warmup_ratio: 0.0
  bf16: true
  gradient_checkpointing: false
  ddp_find_unused_parameters: false
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  dataloader_persistent_workers: false
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 200
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  save_total_limit: 2
  logging_strategy: steps
  logging_steps: 20
  report_to: []
  run_name: full-qwen-omni-7b-hsdp2x2
  seed: 42
  data_seed: 42
  lr_scheduler_kwargs:
    min_lr_rate: 0.2
  max_grad_norm: 1.0
  dp_replicate_size: 2
  dp_shard_size: 2
  fsdp_config:
    version: 2
    reshard_after_forward: true
    state_dict_type: SHARDED_STATE_DICT
    transformer_layer_cls_to_wrap:
      - Embedding
      - Qwen2_5OmniDecoderLayer
      - Qwen2_5OmniThinkerTextModel
      - Qwen2_5OmniAudioEncoder
      - Qwen2_5OmniVisionEncoder
