model:
  grounding_tokenizer_name_or_path: /data2/lhf/.MODEL/bge-base-zh-v1.5
  hypergraph_hidden_dim: 1024
  hypergraph_output_dim: 256
  hypergraph_num_layers: 3
  hypergraph_dropout: 0.0
  grounding_ga_sa_weight: 1.0
  grounding_ga_sn_weight: 3.0
  grounding_sa_sn_weight: 3.0
  grounding_temperature: 0.07

data:
  dataset_path: data/hyprorec-tg-redial
  hyperedge_table_path: data/hyprorec-tg-redial/feature_versions/clap-xclip-20261013T170344Z/hyperedge_table.json
  embeddings_dir_name: feature_versions/clap-xclip-20261013T170344Z/embeddings
  views: [txt, img, ado, vdo]
  grounding_views: [txt, img, ado, vdo]
  topk: 3
  khop: 2

training:
  output_dir: outputs/tg_redial/grounding-semantic
  do_train: true
  do_eval: true
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  num_train_epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.01
  lr_scheduler_type: constant
  max_grad_norm: 0.0
  label_names: []
  prediction_loss_only: true
  ddp_find_unused_parameters: true
  seed: 42
  data_seed: 42
  bf16: true
  eval_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  save_total_limit: 2
  dataloader_num_workers: 4
  dataloader_pin_memory: false
  dataloader_persistent_workers: false
  dataloader_prefetch_factor: 1
  gradient_checkpointing: false
  remove_unused_columns: false
  report_to: []
  run_name: tg-redial-grounding-semantic
