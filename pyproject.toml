[project]
name = "hyprorec"
version = "0.1.0"
description = "Hypergraph prompting for multimodal conversational recommendation"
readme = "README.md"
authors = [
    { name = "linexox", email = "linexox7@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.6.0+cu118",
    "torchvision==0.21.0+cu118",
    "transformers==5.14.1",
    "loguru",
    "numpy",
    "pandas",
    "scikit-learn",
    "accelerate",
    "pillow",
    "wandb==0.19.11",
    "black>=26.3.0",
    "nltk>=3.9.3",
    "tqdm",
    "python-dotenv",
    "pyyaml",
    "safetensors",
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }


[project.scripts]
hyprorec-train = "hyprorec.scripts.train:main"
hyprorec-prepare-hyperedges = "hyprorec.scripts.prepare_hyperedge_table:main"
hyprorec-prepare-embeddings = "hyprorec.scripts.prepare_embeddings:main"
# Modified: expose offline fixed-slot content table preparation.
hyprorec-prepare-content-table = "hyprorec.scripts.prepare_content_table:main"
# START: Expose the two explicit steps that produce v3 offline aligned features.
hyprorec-align = "hyprorec.scripts.align:main"
hyprorec-export-aligned = "hyprorec.scripts.export_aligned_embeddings:main"
# END: Expose the two explicit steps that produce v3 offline aligned features.

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
