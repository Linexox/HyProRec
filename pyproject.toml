[project]
name = "hyprorec"
version = "0.1.0"
description = "Hypergraph prompting for multimodal conversational recommendation"
readme = "README.md"
authors = [
    { name = "linexox", email = "linexox7@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.6.0+cu118",
    "torchvision==0.21.0+cu118",
    "torchaudio==2.6.0+cu118",
    "transformers==4.53.3",
    "numpy",
    "jieba==0.42.1",
    "accelerate",
    "decord",
    "diffusers",
    "einops",
    "librosa",
    "omegaconf",
    "onnxruntime==1.23.0",
    "pillow",
    "scipy",
    "swanlab>=0.6.0",
    "timm",
    "tqdm",
    "python-dotenv",
    "pyyaml",
    "safetensors",
    "bitsandbytes==0.45.5",
]

# [[tool.uv.index]]
# name = "tsinghua"
# url = "https://pypi.tuna.tsinghua.edu.cn/simple"
# default = true

# [[tool.uv.index]]
# name = "aliyun"
# url = "https://mirrors.aliyun.com/pypi/simple"

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }

[dependency-groups]
dev = ["black>=26.3.0"]


[project.scripts]
hyprorec-train = "hyprorec.scripts.train:main"
hyprorec-grounding = "hyprorec.scripts.grounding:main"
hyprorec-export-rec-predictions = "hyprorec.scripts.export_rec_predictions:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
