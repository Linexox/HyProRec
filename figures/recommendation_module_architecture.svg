<rect width="100%" height="100%" fill="white"/>
<text x="35" y="46" font-family="Arial, DejaVu Sans, sans-serif" font-size="30px" fill="#183642" text-anchor="start" font-weight="700">Recommendation module: modality-specific preference and router fusion</text><text x="35" y="78" font-family="Arial, DejaVu Sans, sans-serif" font-size="16px" fill="#5B6B73" text-anchor="start" font-weight="400">A shared MLLM state is converted into four view-specific user preferences, scored against independent item tables, and fused by a learned router.</text><text x="35" y="117" font-family="Arial, DejaVu Sans, sans-serif" font-size="18px" fill="#183642" text-anchor="start" font-weight="700">1. MLLM representation</text><text x="405" y="117" font-family="Arial, DejaVu Sans, sans-serif" font-size="18px" fill="#183642" text-anchor="start" font-weight="700">2. View-specific preference heads</text><text x="405" y="790" font-family="Arial, DejaVu Sans, sans-serif" font-size="18px" fill="#183642" text-anchor="start" font-weight="700">3. Router fusion and ranking</text><rect x="35" y="155" width="300" height="555" rx="20" fill="#EAF4F4" stroke="#2A9D8F" stroke-width="3"/><text x="185" y="230" font-family="Arial, DejaVu Sans, sans-serif" font-size="21px" fill="#183642" text-anchor="middle" font-weight="600"><tspan x="185" dy="0px">MLLM hidden states H_b</tspan><tspan x="185" dy="34px"></tspan><tspan x="185" dy="34px">context tokens +</tspan><tspan x="185" dy="34px">hypergraph prompt tokens</tspan><tspan x="185" dy="34px"></tspan><tspan x="185" dy="34px">H_b ∈ R^(T × d_llm)</tspan></text><text x="185" y="685" font-family="Arial, DejaVu Sans, sans-serif" font-size="16px" fill="#5B6B73" text-anchor="middle" font-weight="400">pooling mask m_b</text><rect x="374" y="155" width="10" height="105" rx="3" fill="#457B9D" stroke="#457B9D" stroke-width="0"/><text x="392" y="213" font-family="Arial, DejaVu Sans, sans-serif" font-size="16px" fill="#457B9D" text-anchor="end" font-weight="700">TXT</text><rect x="405" y="155" width="285" height="105" rx="15" fill="#FFFFFF" stroke="#457B9D" stroke-width="2.5"/><text x="547.5" y="195" font-family="Arial, DejaVu Sans, sans-serif" font-size="17px" fill="#183642" text-anchor="middle" font-weight="600"><tspan x="547.5" dy="0px">TXT attention pooling</tspan><tspan x="547.5" dy="26px">learned query q_txt</tspan></text><rect x="725" y="155" width="210" height="105" rx="15" fill="#F7FBFB" stroke="#457B9D" stroke-width="2.5"/><text x="830.0" y="191" font-family="Arial, DejaVu Sans, sans-serif" font-size="16px" fill="#183642" text-anchor="middle" font-weight="400"><tspan x="830.0" dy="0px">u_b^txt</tspan><tspan x="830.0" dy="25px">norm(g_txt(p_b^txt))</tspan></text><rect x="970" y="155" width="270" height="105" rx="15" fill="#FFFDF6" stroke="#E9C46A" stroke-width="2.2"/><text x="1105.0" y="189" font-family="Arial, DejaVu Sans, sans-serif" font-size="15px" fill="#183642" text-anchor="middle" font-weight="600"><tspan x="1105.0" dy="0px">TXT item table</tspan><tspan x="1105.0" dy="25px">E^txt = norm(W_i^txt X^txt)</tspan></text><rect x="1275" y="155" width="240" height="105" rx="15" fill="#FFF7F3" stroke="#457B9D" stroke-width="2.5"/><text x="1395.0" y="192" font-family="Arial, DejaVu Sans, sans-serif" font-size="16px" fill="#183642" text-anchor="middle" font-weight="600"><tspan x="1395.0" dy="0px">per-view logits s_b,:^txt</tspan><tspan x="1395.0" dy="25px">u^txt · E^txtᵀ / τ</tspan></text><path d="M 335 207.5 L 405 207.5" fill="none" stroke="#457B9D" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 690 207.5 L 725 207.5" fill="none" stroke="#457B9D" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 935 221 L 1275 221" fill="none" stroke="#457B9D" stroke-width="2.0" marker-end="url(#arrow)"/><path d="M 1240 194 L 1275 194" fill="none" stroke="#E9C46A" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="374" y="300" width="10" height="105" rx="3" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="0"/><text x="392" y="358" font-family="Arial, DejaVu Sans, sans-serif" font-size="16px" fill="#2A9D8F" text-anchor="end" font-weight="700">IMG</text><rect x="405" y="300" width="285" height="105" rx="15" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/><text x="547.5" y="340" font-family="Arial, DejaVu Sans, sans-serif" font-size="17px" fill="#183642" text-anchor="middle" font-weight="600"><tspan x="547.5" dy="0px">IMG attention pooling</tspan><tspan x="547.5" dy="26px">learned query q_img</tspan></text><rect x="725" y="300" width="210" height="105" rx="15" fill="#F7FBFB" stroke="#2A9D8F" stroke-width="2.5"/><text x="830.0" y="336" font-family="Arial, DejaVu Sans, sans-serif" font-size="16px" fill="#183642" text-anchor="middle" font-weight="400"><tspan x="830.0" dy="0px">u_b^img</tspan><tspan x="830.0" dy="25px">norm(g_img(p_b^img))</tspan></text><rect x="970" y="300" width="270" height="105" rx="15" fill="#FFFDF6" stroke="#E9C46A" stroke-width="2.2"/><text x="1105.0" y="334" font-family="Arial, DejaVu Sans, sans-serif" font-size="15px" fill="#183642" text-anchor="middle" font-weight="600"><tspan x="1105.0" dy="0px">IMG item table</tspan><tspan x="1105.0" dy="25px">E^img = norm(W_i^img X^img)</tspan></text><rect x="1275" y="300" width="240" height="105" rx="15" fill="#FFF7F3" stroke="#2A9D8F" stroke-width="2.5"/><text x="1395.0" y="337" font-family="Arial, DejaVu Sans, sans-serif" font-size="16px" fill="#183642" text-anchor="middle" font-weight="600"><tspan x="1395.0" dy="0px">per-view logits s_b,:^img</tspan><tspan x="1395.0" dy="25px">u^img · E^imgᵀ / τ</tspan></text><path d="M 335 352.5 L 405 352.5" fill="none" stroke="#2A9D8F" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 690 352.5 L 725 352.5" fill="none" stroke="#2A9D8F" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 935 366 L 1275 366" fill="none" stroke="#2A9D8F" stroke-width="2.0" marker-end="url(#arrow)"/><path d="M 1240 339 L 1275 339" fill="none" stroke="#E9C46A" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="374" y="445" width="10" height="105" rx="3" fill="#F4A261" stroke="#F4A261" stroke-width="0"/><text x="392" y="503" font-family="Arial, DejaVu Sans, sans-serif" font-size="16px" fill="#F4A261" text-anchor="end" font-weight="700">VDO</text><rect x="405" y="445" width="285" height="105" rx="15" fill="#FFFFFF" stroke="#F4A261" stroke-width="2.5"/><text x="547.5" y="485" font-family="Arial, DejaVu Sans, sans-serif" font-size="17px" fill="#183642" text-anchor="middle" font-weight="600"><tspan x="547.5" dy="0px">VDO attention pooling</tspan><tspan x="547.5" dy="26px">learned query q_vdo</tspan></text><rect x="725" y="445" width="210" height="105" rx="15" fill="#F7FBFB" stroke="#F4A261" stroke-width="2.5"/><text x="830.0" y="481" font-family="Arial, DejaVu Sans, sans-serif" font-size="16px" fill="#183642" text-anchor="middle" font-weight="400"><tspan x="830.0" dy="0px">u_b^vdo</tspan><tspan x="830.0" dy="25px">norm(g_vdo(p_b^vdo))</tspan></text><rect x="970" y="445" width="270" height="105" rx="15" fill="#FFFDF6" stroke="#E9C46A" stroke-width="2.2"/><text x="1105.0" y="479" font-family="Arial, DejaVu Sans, sans-serif" font-size="15px" fill="#183642" text-anchor="middle" font-weight="600"><tspan x="1105.0" dy="0px">VDO item table</tspan><tspan x="1105.0" dy="25px">E^vdo = norm(W_i^vdo X^vdo)</tspan></text><rect x="1275" y="445" width="240" height="105" rx="15" fill="#FFF7F3" stroke="#F4A261" stroke-width="2.5"/><text x="1395.0" y="482" font-family="Arial, DejaVu Sans, sans-serif" font-size="16px" fill="#183642" text-anchor="middle" font-weight="600"><tspan x="1395.0" dy="0px">per-view logits s_b,:^vdo</tspan><tspan x="1395.0" dy="25px">u^vdo · E^vdoᵀ / τ</tspan></text><path d="M 335 497.5 L 405 497.5" fill="none" stroke="#F4A261" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 690 497.5 L 725 497.5" fill="none" stroke="#F4A261" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 935 511 L 1275 511" fill="none" stroke="#F4A261" stroke-width="2.0" marker-end="url(#arrow)"/><path d="M 1240 484 L 1275 484" fill="none" stroke="#E9C46A" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="374" y="590" width="10" height="105" rx="3" fill="#E76F51" stroke="#E76F51" stroke-width="0"/><text x="392" y="648" font-family="Arial, DejaVu Sans, sans-serif" font-size="16px" fill="#E76F51" text-anchor="end" font-weight="700">ADO</text><rect x="405" y="590" width="285" height="105" rx="15" fill="#FFFFFF" stroke="#E76F51" stroke-width="2.5"/><text x="547.5" y="630" font-family="Arial, DejaVu Sans, sans-serif" font-size="17px" fill="#183642" text-anchor="middle" font-weight="600"><tspan x="547.5" dy="0px">ADO attention pooling</tspan><tspan x="547.5" dy="26px">learned query q_ado</tspan></text><rect x="725" y="590" width="210" height="105" rx="15" fill="#F7FBFB" stroke="#E76F51" stroke-width="2.5"/><text x="830.0" y="626" font-family="Arial, DejaVu Sans, sans-serif" font-size="16px" fill="#183642" text-anchor="middle" font-weight="400"><tspan x="830.0" dy="0px">u_b^ado</tspan><tspan x="830.0" dy="25px">norm(g_ado(p_b^ado))</tspan></text><rect x="970" y="590" width="270" height="105" rx="15" fill="#FFFDF6" stroke="#E9C46A" stroke-width="2.2"/><text x="1105.0" y="624" font-family="Arial, DejaVu Sans, sans-serif" font-size="15px" fill="#183642" text-anchor="middle" font-weight="600"><tspan x="1105.0" dy="0px">ADO item table</tspan><tspan x="1105.0" dy="25px">E^ado = norm(W_i^ado X^ado)</tspan></text><rect x="1275" y="590" width="240" height="105" rx="15" fill="#FFF7F3" stroke="#E76F51" stroke-width="2.5"/><text x="1395.0" y="627" font-family="Arial, DejaVu Sans, sans-serif" font-size="16px" fill="#183642" text-anchor="middle" font-weight="600"><tspan x="1395.0" dy="0px">per-view logits s_b,:^ado</tspan><tspan x="1395.0" dy="25px">u^ado · E^adoᵀ / τ</tspan></text><path d="M 335 642.5 L 405 642.5" fill="none" stroke="#E76F51" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 690 642.5 L 725 642.5" fill="none" stroke="#E76F51" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 935 656 L 1275 656" fill="none" stroke="#E76F51" stroke-width="2.0" marker-end="url(#arrow)"/><path d="M 1240 629 L 1275 629" fill="none" stroke="#E9C46A" stroke-width="2.0" marker-end="url(#arrow)"/><text x="770" y="745" font-family="Arial, DejaVu Sans, sans-serif" font-size="15px" fill="#5B6B73" text-anchor="middle" font-weight="400">a_b,t^v = softmax_t(φ_v(H_b,t, q_v))</text><text x="1090" y="745" font-family="Arial, DejaVu Sans, sans-serif" font-size="15px" fill="#5B6B73" text-anchor="middle" font-weight="400">p_b^v = Σ_t a_b,t^v H_b,t</text><rect x="405" y="820" width="330" height="95" rx="16" fill="#F0F2FA" stroke="#8E7DBE" stroke-width="2.8"/><text x="570" y="858" font-family="Arial, DejaVu Sans, sans-serif" font-size="17px" fill="#183642" text-anchor="middle" font-weight="600"><tspan x="570" dy="0px">recommendation router r(·)</tspan><tspan x="570" dy="28px">π_b = softmax(r([u_b^v]_v))</tspan></text><rect x="790" y="820" width="315" height="95" rx="16" fill="#F4F8F2" stroke="#2A9D8F" stroke-width="2.8"/><text x="947" y="858" font-family="Arial, DejaVu Sans, sans-serif" font-size="18px" fill="#183642" text-anchor="middle" font-weight="600"><tspan x="947" dy="0px">logit-level fusion</tspan><tspan x="947" dy="28px">s_b,: = Σ_v π_b^v s_b,:^v</tspan></text><rect x="1160" y="820" width="300" height="95" rx="16" fill="#FFF4EE" stroke="#E76F51" stroke-width="2.8"/><text x="1310" y="858" font-family="Arial, DejaVu Sans, sans-serif" font-size="19px" fill="#183642" text-anchor="middle" font-weight="600"><tspan x="1310" dy="0px">final ranking</tspan><tspan x="1310" dy="28px">TopK(s_b, :)</tspan></text><path d="M 830.0 207.5 L 510 820" fill="none" stroke="#8E7DBE" stroke-width="1.6" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M 830.0 352.5 L 510 820" fill="none" stroke="#8E7DBE" stroke-width="1.6" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M 830.0 497.5 L 510 820" fill="none" stroke="#8E7DBE" stroke-width="1.6" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M 830.0 642.5 L 510 820" fill="none" stroke="#8E7DBE" stroke-width="1.6" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M 1395.0 207.5 L 935 820" fill="none" stroke="#7B8C93" stroke-width="1.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M 1395.0 352.5 L 935 820" fill="none" stroke="#7B8C93" stroke-width="1.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M 1395.0 497.5 L 935 820" fill="none" stroke="#7B8C93" stroke-width="1.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M 1395.0 642.5 L 935 820" fill="none" stroke="#7B8C93" stroke-width="1.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M 735 868 L 790 868" fill="none" stroke="#8E7DBE" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 1105 868 L 1160 868" fill="none" stroke="#2A9D8F" stroke-width="2.5" marker-end="url(#arrow)"/><text x="35" y="810" font-family="Arial, DejaVu Sans, sans-serif" font-size="14px" fill="#5B6B73" text-anchor="start" font-weight="400" font-style="italic">Independent user projectors and item-table projections per view; shared initialization does not mean shared parameters.</text><rect x="35" y="944" width="1425" height="40" rx="10" fill="#F8F9FA" stroke="#CBD5D9" stroke-width="1.5"/><text x="750" y="970" font-family="Arial, DejaVu Sans, sans-serif" font-size="14px" fill="#183642" text-anchor="middle" font-weight="400">Training: L = L_fuse + λ_view L_view + λ_bpr L_bpr + λ_bal L_bal + λ_conv L_conv    |    current: λ_view = 0.2, λ_conv = 1, λ_bpr = λ_bal = 0</text></svg>